[project]
name = "simple-api"
version = "0.1.0"
description = "FastAPI and SQLite learning API using the Chinook sample database"
readme = "README.md"
authors = [
    { name = "nogikun", email = "ok220075@oks.iput.ac.jp" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
simple-api = "simple_api:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
