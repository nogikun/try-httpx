[project]
name = "sync-requests"
version = "0.1.0"
description = "Synchronous standard-library client for the track API"
readme = "README.md"
authors = [
    { name = "nogikun", email = "ok220075@oks.iput.ac.jp" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
sync-requests = "sync_requests:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
